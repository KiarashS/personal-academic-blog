<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicons/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="/favicons/apple-touch-icon.png" />

    <!-- The browser chrome matches the page, in whichever theme the reader is
         actually seeing. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fdfdfc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14140f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kiarash S." />
    <!-- Replaced per route by scripts/prerender.mjs; this is only what a
         dev-server tab shows before the app mounts. Keep it in step with
         `title` in src/site.config.ts. -->
    <title>Kiarash Soleimanzadeh</title>
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.dataset.theme = stored;
          }
        } catch (e) {}
      })();

      // The loading screen is switched on from here rather than being on by
      // default, so a reader with no JavaScript never meets one that nothing
      // can turn off. `SplashScreen` clears the flag once React has hydrated;
      // the timer is the failsafe for the case where the bundle never arrives
      // at all, and it is set by the same script that set the flag, so the two
      // cannot come apart.
      document.documentElement.dataset.loading = '';
      setTimeout(function () {
        delete document.documentElement.dataset.loading;
      }, 8000);
    </script>
  </head>
  <body>
    <!-- Outside #root: it has to be in the document before any of the bundle
         runs, and React must not try to hydrate it. -->
    <div class="splash" aria-hidden="true"><span class="splash__ring"></span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
