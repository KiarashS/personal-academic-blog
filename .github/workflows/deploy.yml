name: Build and deploy

on:
  push:
    branches: [main]
  # Once a day, just after midnight UTC, so what depends on the date changes
  # without a push: a post queued for today goes live, and a notice, news list
  # or opening past its date leaves the prerendered HTML too, for readers and
  # crawlers without JavaScript. Seven past rather than on the hour, when
  # GitHub's scheduler is busiest and runs start late.
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # scripts/lock-discussions.mjs locks a readonly post's comment thread, and
  # unlocks it again when the post is set back to on.
  discussions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Sets the Pages build type to "workflow" if it is not already, which is
      # also what reconciles the github-pages environment's deployment branch
      # policy after the default branch changes.
      - id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Diagrams are rendered to SVG at build time, which needs a browser.
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      # One date for the whole build: the Markdown plugin, and the two Vite
      # builds each read it at their own start. See vite.config.ts.
      - run: echo "BUILD_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          # base_path is "/<repo>" for a project site and empty for a user site
          # or a custom domain, so the trailing slash covers both.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - run: npm run links
      - run: npm run audit:a11y
      # After the checks, so a build that fails them changes nothing on GitHub.
      - run: node scripts/lock-discussions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
