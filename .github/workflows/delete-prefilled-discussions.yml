name: Delete prefilled discussions (one-off)

# Runs when this file or its script changes on main, or by hand; removed
# together with its script once the prefilled threads are gone.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/delete-prefilled-discussions.yml
      - scripts/delete-prefilled-discussions.mjs

permissions:
  discussions: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/delete-prefilled-discussions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
