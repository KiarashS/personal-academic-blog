name: Delete prefilled discussions (one-off)

# Run once by hand, then removed together with its script.
on:
  workflow_dispatch:

permissions:
  discussions: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/delete-prefilled-discussions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
