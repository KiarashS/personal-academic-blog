name: Checks

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # One date for the whole build: the Markdown plugin, and the two Vite
      # builds each read it at their own start. See vite.config.ts.
      - run: echo "BUILD_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
      - run: npm run build
      # Internal links and accessibility are checked against what the build
      # actually produced, not against the source.
      - run: npm run links
      - run: npm run audit:a11y
      - name: Check external links
        run: node scripts/check-links.mjs --external
        continue-on-error: true

  # Dependabot's patch and minor updates merge themselves once the checks above
  # pass on their head commit: the same lint, typecheck, tests, build, link
  # check and accessibility audit the deploy runs. A major update, or one whose
  # checks fail, stays open for a person to look at.
  #
  # Both conditions, not just the author: `actor` is whoever triggered this
  # run, so a commit someone else pushes to a Dependabot branch does not merge.
  # A pull request that no longer applies fails the merge and stays open;
  # Dependabot rebases it once main moves on, and the rebase runs this again.
  dependabot:
    needs: checks
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      # For a grouped pull request, update-type is the largest change in it.
      # Only a named patch or minor merges; an empty type is treated as major.
      - id: metadata
        uses: dependabot/fetch-metadata@v3
      # --match-head-commit: only the commit the checks ran on, not one pushed
      # to the branch while they were running.
      - if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: >-
          gh pr merge "${{ github.event.pull_request.number }}" --squash
          --match-head-commit "${{ github.event.pull_request.head.sha }}"
      # A merge made with this token does not start the push workflow on main,
      # so the deploy is asked for by name.
      - if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh workflow run deploy.yml --ref main
